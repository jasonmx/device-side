# One block per action: target filters and field selectors only. Names and descriptions live in strings.json.
# Target filters are a UI convenience; adapters enforce support through supports(). Each filter lists exactly the
# integrations with an adapter for that action and the domains in their scope (tests/core/test_actions_setup.py).
# Field filters are copied from light/services.yaml so the light fields hide when no selected target is a light that
# can use them. They are written out, not shared through top-level .anchor keys as core does: hassfest rejects those
# in a custom component.

turn_on_for:
  target:
    entity:
      - domain: [light, switch]
        integration: shelly
      - domain: light
        integration: mqtt
      - domain: switch
        integration: matter
      - domain: light
        integration: zha
  fields:
    duration: &duration
      required: true
      example: "00:05:00"
      selector:
        duration:
          enable_millisecond: true
    brightness: &brightness
      filter: &dimmable
        attribute:
          supported_color_modes:
            - light.ColorMode.BRIGHTNESS
            - light.ColorMode.COLOR_TEMP
            - light.ColorMode.HS
            - light.ColorMode.XY
            - light.ColorMode.RGB
            - light.ColorMode.RGBW
            - light.ColorMode.RGBWW
      selector:
        number:
          min: 1
          max: 255
    color_temp_kelvin: &color_temp_kelvin
      filter: &color_temp
        attribute:
          supported_color_modes:
            - light.ColorMode.COLOR_TEMP
            - light.ColorMode.HS
            - light.ColorMode.XY
            - light.ColorMode.RGB
            - light.ColorMode.RGBW
            - light.ColorMode.RGBWW
      selector:
        color_temp:
          unit: "kelvin"
          min: 2000
          max: 6500
    rgb_color: &rgb_color
      filter: &color_modes
        attribute:
          supported_color_modes:
            - light.ColorMode.HS
            - light.ColorMode.XY
            - light.ColorMode.RGB
            - light.ColorMode.RGBW
            - light.ColorMode.RGBWW
      example: "[255, 100, 100]"
      selector:
        color_rgb:
    hs_color: &hs_color
      filter:
        attribute:
          supported_color_modes:
            - light.ColorMode.HS
            - light.ColorMode.XY
            - light.ColorMode.RGB
            - light.ColorMode.RGBW
            - light.ColorMode.RGBWW
      example: "[300, 70]"
      selector:
        object:
    xy_color: &xy_color
      filter:
        attribute:
          supported_color_modes:
            - light.ColorMode.HS
            - light.ColorMode.XY
            - light.ColorMode.RGB
            - light.ColorMode.RGBW
            - light.ColorMode.RGBWW
      example: "[0.52, 0.43]"
      selector:
        object:
    transition:
      filter:
        supported_features:
          - light.LightEntityFeature.TRANSITION
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: seconds

turn_off_for:
  target:
    entity:
      - domain: [light, switch]
        integration: shelly
  fields:
    duration: *duration

set_attributes:
  target:
    entity:
      - domain: light
        integration: hue
      - domain: light
        integration: zha
  fields:
    brightness:
      example: 50
      filter: *dimmable
      selector: &percent
        number:
          min: 0.4
          max: 100
          step: 0.2
          unit_of_measurement: "%"
    min_brightness:
      example: 20
      filter: *dimmable
      selector: *percent
    max_brightness:
      example: 80
      filter: *dimmable
      selector: *percent
    color_temp_kelvin:
      example: 2800
      filter: *color_temp
      selector:
        number:
          min: 2200
          max: 6535
          step: 10
          unit_of_measurement: K
    rgb_color: *rgb_color
    hs_color: *hs_color
    xy_color: *xy_color

raise_brightness:
  target: &hue_mqtt_zha
    entity:
      - domain: light
        integration: hue
      - domain: light
        integration: mqtt
      - domain: light
        integration: zha
  fields:
    sweep_time: &sweep_time
      default: 5
      selector:
        number:
          min: 0.1
          max: 3600
          step: any
          unit_of_measurement: s
          mode: box
    limit:
      example: 80
      filter: *dimmable
      selector:
        number:
          min: 1
          max: 100
          step: 0.2
          unit_of_measurement: "%"

lower_brightness:
  target: *hue_mqtt_zha
  fields:
    sweep_time: *sweep_time
    limit:
      example: 30
      filter: *dimmable
      selector:
        number:
          min: 0
          max: 99
          step: 0.2
          unit_of_measurement: "%"

raise_saturation:
  target: &mqtt_zha
    entity:
      - domain: light
        integration: mqtt
      - domain: light
        integration: zha
  fields:
    sweep_time: *sweep_time
    limit:
      example: 80
      filter: *color_modes
      selector: &saturation
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"

lower_saturation:
  target: *mqtt_zha
  fields:
    sweep_time: *sweep_time
    limit:
      example: 30
      filter: *color_modes
      selector: *saturation

raise_hue:
  target: *mqtt_zha
  fields:
    sweep_time: *sweep_time

lower_hue:
  target: *mqtt_zha
  fields:
    sweep_time: *sweep_time

stop:
  target: *hue_mqtt_zha

get_attributes:
  target:
    entity:
      - domain: light
        integration: hue
      - domain: [light, switch]
        integration: shelly
      - domain: light
        integration: mqtt
      - domain: switch
        integration: matter
      - domain: light
        integration: zha

set_scene:
  target:
    entity:
      - domain: scene
        integration: hue
