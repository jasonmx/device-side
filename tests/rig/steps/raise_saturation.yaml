# Saturation on Zigbee2MQTT and ZHA: written as a color at the current hue, which the bulb fades in xy. HA's hs is
# derived from the bulb's xy, so it lands near the limit, not on it.
action: raise_saturation
rig_seconds: 60
tests:
  - name: saturation_to_a_limit
    roles: [light_color]
    only: [zigbee2mqtt, zha]
    setup:
      - set: {state: on, brightness_pct: 70, hs_color: [200, 30]}
    steps:
      - call: {limit: 80, sweep_time: 5}  # 30 % to 80 % takes 2.5 s
      - expect_response: {status: expected, integration: self}
      - wait: 2.5 + tol
      - expect_state: {state: on, hs_color.1: {min: 70, max: 90}}
      - expect_matches_read: {attributes: [xy_color.0, xy_color.1], tolerance: 0.01, within: 2}
    observe:
      see: 'The light at hue 200° (sky blue), 30 % saturation, deepening over 2.5 s to 80 %, then holding.'
      watch: 'The hue: it stays blue all the way, with no swing toward green or purple.'
      ask: Did it deepen smoothly and stay the same blue, then hold?
