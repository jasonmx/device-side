# hue_dimmer tests/RELEASE_CHECKLIST.md §2 as steps; §2.6 (stop when idle) and stopping a move to off are in
# stop.yaml. Each test runs on a lamp and then a room; on the room, expect_state checks every member light.
# HA shows a Hue fade's end value at once, so samples read device_side's prediction, in percent.
action: move
rig_seconds: 900
tests:
  - name: raise  # §2.1
    roles: [light_ct, group]
    setup:
      - set: {state: on, brightness_pct: 20}
    steps:
      - call: {brightness: up, sweep_time: 5}
      - expect_response: {status: expected, integration: self}
      - sample: {attribute: brightness, for: 3, expect: rising, source: device_side}
      # HA may end on a bulb's mid-ramp report (Tested behavior), so read the prediction.
      - wait: 1 + tol
      - sample: {attribute: brightness, for: 0.5, expect: steady, min: 99, source: device_side}
    observe:
      see: The light at 20 %, climbing to full over 5 s.
      watch: Steps or flashes on the way up.
      ask: Did brightness climb smoothly to 100%, with no steps or flashes?

  - name: lower_to_off  # §2.2; the default sweep time is under 10 s
    roles: [light_ct, group]
    setup:
      - set: {state: on, brightness_pct: 100}
    steps:
      - call: {brightness: down}
      - expect_response: {status: expected, integration: self}
      - expect_state: {state: off, within: 10}
    observe:
      see: The light at full, fading to off in under 10 s.
      watch: Steps on the way down, and that it ends off.
      ask: Did it fade smoothly and turn off at the end?

  - name: raise_from_off  # §2.3; the start is watched in raise_after_soft_off
    roles: [light_ct, group]
    setup:
      - set: {state: off}
    steps:
      - call: {brightness: up, sweep_time: 5}
      - sample: {attribute: brightness, for: 1, expect: rising, max: 50, source: device_side}

  - name: raise_after_soft_off  # a plain soft off keeps the stored brightness: does the next move up start there?
    roles: [light_ct, group]
    setup:
      - set: {state: on, brightness_pct: 60}
      - call: {brightness: down, sweep_time: 3}
      - expect_state: {state: off, within: 2 + tol}
      - wait: 2
    steps:
      - call: {brightness: up, sweep_time: 10}
      - wait: 3
      - call: {action: stop}
    observe:
      see: The light, just faded off from 60 %, climbing slowly, stopped after 3 s.
      watch: 'Where it holds: about a third of full means it climbed from the bottom; about three quarters means it jumped to 60 % first.'
      ask: Did it light low and hold at about a third of full, rather than jump up first and hold near three quarters?

  - name: lower_to_a_limit  # §2.4
    roles: [light_ct, group]
    steps:
      - set: {state: on, brightness_pct: 100}
      - call: {brightness: down, brightness_limit: 30, sweep_time: 5}
      - expect_state: {state: on, brightness: {min: 70, max: 84}, within: 4 + tol}
      - wait: 2
      - expect_state: {state: on, brightness: {min: 70, max: 84}}

  - name: raise_stop_raise  # §2.5
    roles: [light_ct, group]
    setup:
      - set: {state: on, brightness_pct: 10}
    steps:
      - call: {brightness: up, sweep_time: 10}
      - wait: 3
      - call: {action: stop}
      - expect_response: {status: expected}
      - sample: {attribute: brightness, for: 4, expect: steady, source: device_side}
      - call: {brightness: up, sweep_time: 10}
      - sample: {attribute: brightness, for: 2, expect: rising, max: 78, source: device_side}
    observe:
      see: 'The light at 10 %: a slow climb for 3 s, a 4 s hold, then the climb again.'
      watch: 'The hold and the restart: no drift while held, no jump when it resumes.'
      ask: Did it hold where it stopped, then continue from that point?

  - name: lower_stop_lower  # §2.5 with lower; watched in stop.yaml (the cut) and raise_stop_raise
    roles: [light_ct, group]
    setup:
      - set: {state: on, brightness_pct: 90}
    steps:
      - call: {brightness: down, sweep_time: 10}
      - wait: 3
      - call: {action: stop}
      - sample: {attribute: brightness, for: 4, expect: steady, source: device_side}
      - call: {brightness: down, sweep_time: 10}
      - sample: {attribute: brightness, for: 2, expect: falling, min: 12, source: device_side}

  - name: light_moved_mid_room_move  # needs light_ct to be one of the group's lights
    roles: [group]
    setup:
      - set: {state: on, brightness_pct: 100}
    steps:
      - call: {brightness: down, sweep_time: 10}
      - wait: 4
      - call: {target: light_ct, brightness: up, sweep_time: 10}
      - expect_response: {target: light_ct, status: expected, integration: self}
    observe:
      see: The room at full, fading over 10 s; after 4 s the lamp alone turns back up.
      watch: 'The lamp as it turns: no jump to the bottom or top first.'
      ask: Did the lamp turn back up from where the room's fade had it, without jumping to the bottom or top first?

  - name: ha_change_mid_move  # a light.turn_on from HA drops the prediction, so the next move starts from it
    roles: [light_ct, group]
    setup:
      - set: {state: on, brightness_pct: 20}
    steps:
      - call: {brightness: up, sweep_time: 10}
      - wait: 2
      - set: {state: on, brightness_pct: 80}
      - call: {brightness: down, sweep_time: 10}
      - sample: {attribute: brightness, for: 1.5, expect: falling, min: 60, source: device_side}

  - name: late_stop_report  # the bulb's late report of where it halted keeps the prediction: no jump on the next move
    roles: [light_ct, group]
    setup:
      - set: {state: on, brightness_pct: 10}
    steps:
      - call: {brightness: up, sweep_time: 10}
      - wait: 3
      - call: {action: stop}
      - wait: 10
      - call: {brightness: up, sweep_time: 10}
      - sample: {attribute: brightness, for: 2, expect: rising, min: 30, max: 65, source: device_side}

  # Color temperature: 153 to 454 mirek (6500 K to 2200 K) on the rig's bulbs. Kelvin falls as a light warms.
  - name: warmer
    roles: [light_ct, group]
    setup:
      - set: {state: on, brightness_pct: 50, color_temp_kelvin: 4000}
    steps:
      - call: {color_temp: warmer, sweep_time: 5}  # 250 to 454 mirek takes 3.4 s
      - expect_response: {status: expected, integration: self}
      - sample: {attribute: color_temp_kelvin, for: 2, expect: falling, source: device_side}
      - wait: 1.5 + tol
      - sample: {attribute: color_temp_kelvin, for: 0.5, expect: steady, max: 2210, source: device_side}
      - expect_state: {state: on, color_temp_kelvin: {max: 2210}}

  - name: cooler_to_a_limit
    roles: [light_ct, group]
    setup:
      - set: {state: on, brightness_pct: 50, color_temp_kelvin: 2700}
    steps:
      - call: {color_temp: cooler, color_temp_limit: 4000, sweep_time: 5}  # 370 to 250 mirek takes 2 s
      - expect_response: {status: expected, integration: self}
      - wait: 2 + tol
      - sample: {attribute: color_temp_kelvin, for: 0.5, expect: steady, min: 3950, max: 4050, source: device_side}
      - expect_state: {state: on, color_temp_kelvin: {min: 3950, max: 4050}}

  - name: warmer_stop_warmer
    roles: [light_ct, group]
    setup:
      - set: {state: on, brightness_pct: 50, color_temp_kelvin: 6500}
    steps:
      - call: {color_temp: warmer, sweep_time: 10}  # 30 mirek a second: about 243 mirek (4100 K) after 3 s
      - wait: 3
      - call: {action: stop}
      - expect_response: {status: expected}
      - sample: {attribute: color_temp_kelvin, for: 4, expect: steady, min: 3700, max: 4600, source: device_side}
      - call: {color_temp: warmer, sweep_time: 10}
      - sample: {attribute: color_temp_kelvin, for: 2, expect: falling, min: 3000, max: 4600, source: device_side}
    observe:
      see: 'The light in cool white: a slow warming for 3 s, a 4 s hold, then the warming again.'
      watch: 'The hold and the restart: no drift while held, no jump when it resumes.'
      ask: Did it hold where it stopped, then carry on warming from that point?

  - name: color_temp_at_limit
    roles: [light_ct, group]
    setup:
      - set: {state: on, brightness_pct: 50, color_temp_kelvin: 2000}  # clamped to the warmest the bulb makes
    steps:
      - call: {color_temp: warmer}
      - expect_response: {status: unchanged, integration: self, detail: at_limit}

  - name: color_temp_on_off_light
    roles: [light_ct, group]
    setup:
      - set: {state: off}
    steps:
      - call: {color_temp: warmer}
      - expect_response: {status: unchanged, integration: self, detail: off}
      - expect_state: {state: off}

  - name: brighter_and_cooler  # two writes, each with its own duration: the bridge runs them independently
    roles: [light_ct, group]
    setup:
      - set: {state: on, brightness_pct: 20, color_temp_kelvin: 2700}
    steps:
      - call: {brightness: up, color_temp: cooler, sweep_time: 10}  # brightness takes 8 s, color temperature 7.2 s
      - expect_response: {status: expected, integration: self}
      - sample: {attribute: brightness, for: 2, expect: rising, max: 50, source: device_side}
      - sample: {attribute: color_temp_kelvin, for: 2, expect: rising, max: 4500, source: device_side}
      - wait: 4 + tol
      - expect_state: {state: on, brightness: {min: 250}, color_temp_kelvin: {min: 6400}}
    observe:
      see: The light dim and warm, brightening to full and cooling to daylight white together over about 8 s.
      watch: Whether both change all the way through, rather than one jumping or stalling.
      ask: Did it brighten and cool smoothly at the same time, with neither jumping?
