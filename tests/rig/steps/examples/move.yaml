# hue_dimmer tests/RELEASE_CHECKLIST.md §2 as steps. Only the parser tests load this until slice 7 ports move.
# Each test runs on a lamp and then a room; on the room, expect_state checks every member light.
action: move
rig_seconds: 120
tests:
  - name: raise  # §2.1
    roles: [light_color, group]
    steps:
      - set: {state: on, brightness_pct: 20}
      - call: {brightness: brighter, sweep_time: 5}
      - expect_response: {status: expected, integration: self}
      - sample: {attribute: brightness, for: 3, expect: rising}
      - expect_state: {brightness: 255, within: 2 + tol}
      - observe: Did brightness climb smoothly to 100%, with no steps or flashes?

  - name: lower_to_off  # §2.2; the default sweep time is under 10 s
    roles: [light_color, group]
    steps:
      - set: {state: on, brightness_pct: 100}
      - call: {brightness: dimmer}
      - sample: {attribute: brightness, for: 2, expect: falling}
      - expect_state: {state: off, within: 10}
      - observe: Did it fade smoothly and turn off at the end?

  - name: raise_from_off  # §2.3
    roles: [light_color, group]
    steps:
      - set: {state: off}
      - call: {brightness: brighter, sweep_time: 5}
      - sample: {attribute: brightness, for: 1, expect: rising, max: 128}
      - observe: Did it climb from the bottom, without jumping to its previous brightness first?

  - name: lower_to_a_limit  # §2.4
    roles: [light_color, group]
    steps:
      - set: {state: on, brightness_pct: 100}
      - call: {brightness: dimmer, brightness_limit: 30, sweep_time: 5}
      - expect_state: {state: on, brightness: {min: 70, max: 84}, within: 4 + tol}
      - wait: 2
      - expect_state: {state: on, brightness: {min: 70, max: 84}}

  - name: raise_stop_raise  # §2.5
    roles: [light_color, group]
    steps:
      - set: {state: on, brightness_pct: 10}
      - call: {brightness: brighter, sweep_time: 10}
      - wait: 3
      - call: {action: stop}
      - expect_response: {status: expected}
      - sample: {attribute: brightness, for: 4, expect: steady}
      - call: {brightness: brighter, sweep_time: 10}
      - sample: {attribute: brightness, for: 2, expect: rising, max: 200}
      - observe: Did it hold where it stopped, then continue from that point?

  - name: lower_stop_lower  # §2.5, repeated with lower
    roles: [light_color, group]
    steps:
      - set: {state: on, brightness_pct: 90}
      - call: {brightness: dimmer, sweep_time: 10}
      - wait: 3
      - call: {action: stop}
      - sample: {attribute: brightness, for: 4, expect: steady}
      - call: {brightness: dimmer, sweep_time: 10}
      - sample: {attribute: brightness, for: 2, expect: falling, min: 30}
      - observe: Did it hold where it stopped, then continue from that point?

  - name: stop_when_idle  # §2.6
    roles: [light_color, group]
    steps:
      - set: {state: on, brightness_pct: 50}
      - call: {action: stop}
      - expect_response: {status: expected}
      - sample: {attribute: brightness, for: 2, expect: steady}
