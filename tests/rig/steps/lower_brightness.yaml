# hue_dimmer tests/RELEASE_CHECKLIST.md §2 as steps, lowering; raise_brightness.yaml has the rest, and stop.yaml
# stopping a lower to off. Each test runs on a lamp and then a room; on the room, expect_state checks every member
# light. HA shows a fade's end value at once, so samples read device_side: Hue's prediction, Zigbee2MQTT's live read,
# in percent.
action: lower_brightness
rig_seconds: 340
tests:
  - name: lower_to_off  # §2.2; the default sweep time is under 10 s
    roles: [light_ct, group]
    setup:
      - set: {state: on, brightness_pct: 100}
    steps:
      - call: {}
      - expect_response: {status: expected, integration: self}
      - expect_state: {state: off, within: 10}

  - name: lower_to_a_limit  # §2.4
    roles: [light_ct, group]
    steps:
      - set: {state: on, brightness_pct: 100}
      - call: {limit: 30, sweep_time: 5}
      - expect_state: {state: on, brightness: {min: 70, max: 84}, within: 4 + tol}
      - wait: 2
      - expect_state: {state: on, brightness: {min: 70, max: 84}}

  - name: lower_stop_lower  # §2.5 with lower; the cut and the hold are checked in stop.yaml and raise_stop_raise
    roles: [light_ct, group]
    setup:
      - set: {state: on, brightness_pct: 90}
    steps:
      - call: {sweep_time: 10}
      - wait: 3
      - call: {action: stop}
      - sample: {attribute: brightness, for: 4, expect: steady, source: device_side}
      - call: {sweep_time: 10}
      - sample: {attribute: brightness, for: 2, expect: falling, min: 12, source: device_side}

  - name: light_raised_mid_room_lower  # needs light_ct to be one of the group's lights
    roles: [group]
    setup:
      - set: {state: on, brightness_pct: 100}
    steps:
      - call: {sweep_time: 10}
      - wait: 4
      - call: {action: raise_brightness, target: light_ct, sweep_time: 10}
      - expect_response: {target: light_ct, status: expected, integration: self}
      # From where the room's fade had it, about 60 %: a jump to the bottom breaks min, one to the top breaks rising.
      - sample: {target: light_ct, attribute: brightness, for: 2, expect: rising, min: 40, source: device_side}
