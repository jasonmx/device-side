# Hue on Zigbee2MQTT: hue_move, a cycle the bulb runs until a stop, so each test ends with one. Zigbee2MQTT publishes a
# hue stop's color as hs, which HA takes only with z2m_color_modes on (the default).
action: lower_hue
rig_seconds: 60
tests:
  - name: cycles_down_the_wheel
    roles: [light_color]
    only: [zigbee2mqtt]
    setup:
      - set: {state: on, brightness_pct: 70, hs_color: [200, 90]}
    steps:
      - call: {sweep_time: 20}  # 18° a second: about 146° after 3 s
      - expect_response: {status: expected, integration: self}
      - wait: 3
      - call: {action: stop}
      - expect_matches_read: {attributes: [xy_color.0, xy_color.1], tolerance: 0.01, within: 3}
      - expect_state: {state: on, hs_color.0: {min: 134, max: 158}}
    observe:
      see: 'The light at hue 200° (sky blue), 90 % saturation, turning toward green at 18° a second, stopped after 3 s near 146° (green).'
      watch: 'The direction: blue to cyan to green, never toward purple.'
      ask: Did it turn from blue toward green, then stop?
