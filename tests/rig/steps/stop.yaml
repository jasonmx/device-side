# hue_dimmer tests/RELEASE_CHECKLIST.md §2.5 and §2.6 from the stop side; move.yaml checks the move that follows.
# Samples after a move read device_side (Hue's prediction, Zigbee2MQTT's live read), in percent: HA shows a fade's
# end value at once.
action: stop
rig_seconds: 360
tests:
  - name: halts_a_move  # §2.5; the hold is watched in move.yaml's raise_stop_raise
    roles: [light_ct, group]
    setup:
      - set: {state: on, brightness_pct: 10}
    steps:
      - call: {action: move, brightness: up, sweep_time: 10}
      - wait: 3
      - call: {}
      - expect_response: {status: expected, integration: self}
      - sample: {attribute: brightness, for: 4, expect: steady, max: 78, source: device_side}

  - name: halts_a_move_to_off  # Hue refuses a dimming stop during a soft off, so it is cut with on + brightness
    roles: [light_ct, group]
    setup:
      - set: {state: on, brightness_pct: 100}
    steps:
      - call: {action: move, brightness: down, sweep_time: 10}
      - wait: 3
      - call: {}
      - expect_response: {status: expected, integration: self}
      - expect_state: {state: on, within: tol}
      - sample: {attribute: brightness, for: 4, expect: steady, min: 47, max: 82, source: device_side}
    observe:
      see: The light at full, fading slowly toward off, stopped after 3 s.
      watch: 'The stop: it holds about two thirds up, with no flash, jump or blink off first.'
      ask: Did it stop part way down and hold there, with no flash, jump or blink off?

  - name: stop_when_idle  # §2.6
    roles: [light_ct, group]
    steps:
      - set: {state: on, brightness_pct: 50}
      - call: {}
      - expect_response: {status: expected}
      - sample: {attribute: brightness, for: 2, expect: steady}

  # Zigbee2MQTT publishes a hue stop's color as hs, which HA takes only with z2m_color_modes on (the default).
  - name: hue_cycle_stop
    roles: [light_color]
    only: [zigbee2mqtt]
    setup:
      - set: {state: on, brightness_pct: 70, hs_color: [30, 90]}
    steps:
      - call: {action: move, hue: up, sweep_time: 20}  # 18° a second: about 84° after 3 s
      - wait: 3
      - call: {}
      - expect_response: {status: expected, integration: self}
      - expect_matches_read: {attributes: [xy_color.0, xy_color.1], tolerance: 0.01, within: 3}
      - wait: 3
      - expect_matches_read: {attributes: [xy_color.0, xy_color.1], tolerance: 0.01}
    observe:
      see: 'The light at hue 30° (orange), 90 % saturation, turning through yellow at 18° a second, stopped after 3 s near 84°.'
      watch: 'The stop and the 1 s after it: no jump, and and no second change a second later.'
      ask: Did it stop where it was and hold, with no jump at the stop or a second later?

  - name: saturation_down_stop
    roles: [light_color]
    only: [zigbee2mqtt]
    setup:
      - set: {state: on, brightness_pct: 70, hs_color: [200, 90]}
    steps:
      - call: {action: move, saturation: down, sweep_time: 10}  # 9 % a second: about 63 % after 3 s
      - wait: 3
      - call: {}
      - expect_response: {status: expected, integration: self}
      - expect_matches_read: {attributes: [xy_color.0, xy_color.1], tolerance: 0.01, within: 3}
      - wait: 3
      - expect_matches_read: {attributes: [xy_color.0, xy_color.1], tolerance: 0.01}
    observe:
      see: 'The light at hue 200° (sky blue), 90 % saturation, paling at 9 % a second, stopped after 3 s near 63 %.'
      watch: 'The stop: it holds, with no drift on toward white and no jump a second later.'
      ask: Did it stop part way pale and hold there, with no drift or jump?

  # One stop halting brightness and a color move together. A Hue bulb's brightness and color temperature stop let
  # the color carry on (docs/plans/2026-10-28-z2m-move-stop.md), so each attribute is held to its own halt.
  - name: halts_brightness_and_saturation
    roles: [light_color]
    only: [zigbee2mqtt]
    setup:
      - set: {state: on, brightness_pct: 20, hs_color: [200, 90]}
    steps:
      # 10 % and 9 % a second: about 50 % brightness and 63 % saturation after 3 s
      - call: {action: move, brightness: up, saturation: down, sweep_time: 10}
      - wait: 3
      - call: {}
      - expect_response: {status: expected, integration: self}
      - expect_matches_read: {attributes: [xy_color.0, xy_color.1], tolerance: 0.01, within: 3}
      - expect_state: {state: on, hs_color.1: {min: 53, max: 73}}
      - sample: {attribute: brightness, for: 3, expect: steady, min: 38, max: 70, source: device_side}
      - expect_matches_read: {attributes: [xy_color.0, xy_color.1], tolerance: 0.01}
      - expect_state: {state: on, hs_color.1: {min: 53, max: 73}}
    observe:
      see: 'The light at 20 % (level 51), hue 200° (sky blue) at 90 % saturation, brightening 10 % a second and paling 9 % a second, stopped after 3 s near 50 % (level 128) and 63 % saturation.'
      watch: 'The stop and the 2 s after it: brightness and color both freeze at once, with no color carrying on, no flash and no jump a second later.'
      ask: Did brightness and color both stop together and hold, with no drift, flash or jump?

  - name: halts_brightness_and_hue
    roles: [light_color]
    only: [zigbee2mqtt]
    setup:
      - set: {state: on, brightness_pct: 20, hs_color: [30, 90]}
    steps:
      # 5 % and 18° a second: about 35 % brightness and hue 84° after 3 s
      - call: {action: move, brightness: up, hue: up, sweep_time: 20}
      - wait: 3
      - call: {}
      - expect_response: {status: expected, integration: self}
      - expect_matches_read: {attributes: [xy_color.0, xy_color.1], tolerance: 0.01, within: 3}
      - expect_state: {state: on, hs_color.0: {min: 72, max: 96}}
      - sample: {attribute: brightness, for: 3, expect: steady, min: 25, max: 50, source: device_side}
      - expect_matches_read: {attributes: [xy_color.0, xy_color.1], tolerance: 0.01}
      - expect_state: {state: on, hs_color.0: {min: 72, max: 96}}
    observe:
      see: 'The light at 20 % (level 51), hue 30° (orange) at 90 % saturation, brightening 5 % a second and turning toward yellow at 18° a second, stopped after 3 s near 35 % (level 89) and hue 84° (yellow-green).'
      watch: 'The stop and the 2 s after it: brightness and hue both freeze at once, with no hue carrying on, no flash and no jump a second later.'
      ask: Did brightness and hue both stop together and hold, with no drift, flash or jump?
