# hue_dimmer tests/RELEASE_CHECKLIST.md §4 as steps.
# On the group role the set gives every member the same values, so the room's own row reads them back too.
action: get_attributes
rig_seconds: 240
tests:
  - name: reads_while_off  # §4.1
    roles: [light_ct, group]
    steps:
      - set: {state: on, brightness: 102, color_temp_kelvin: 2700}
      - set: {state: off}
      - call: {}
      - expect_response:
          attributes: {brightness: {min: 39, max: 41}, color_temp_kelvin: {min: 2650, max: 2750}}

  - name: predicts_mid_move  # §4.2: about 40% three seconds in, not the 100% the bridge reports
    roles: [light_ct, group]
    only: [hue]  # the only integration with move
    steps:
      - set: {state: on, brightness_pct: 10}
      - call: {action: move, brightness: up, sweep_time: 10}
      - wait: 3
      - call: {}
      - expect_response: {attributes: {brightness: {min: 25, max: 55}}}

  # Shelly reports only the active mode's color, and the bulb keeps it while off.
  - name: reads_rgb_while_off
    roles: [light_color]
    only: [shelly]
    steps:
      - set: {state: on, rgb_color: [255, 0, 0]}
      - set: {state: off}
      - call: {}
      - expect_response: {attributes: {rgb_color: [255, 0, 0], hs_color: [0, 100], color_temp_kelvin: null}}

  # The device's own timer, read back with the time it has left; the row loses it once the timer ends.
  # `"off"` is quoted: YAML reads a bare off as false.
  - name: reads_a_running_timer
    roles: [switch_plug, light_onoff, light_wrapped, light_dimmable]
    steps:
      - set: {state: off}
      - call: {action: turn_on_for, duration: 20}
      - call: {}
      - expect_response: {attributes: {timer.turns: "off", timer.remaining_s: {min: 15, max: 20}}}
      - wait: 5  # the device counts down, rather than echoing the duration
      - call: {}
      - expect_response: {attributes: {timer.remaining_s: {min: 10, max: 16}}}
      - expect_state: {state: off, within: 15 + 2 * tol}
      - call: {}
      - expect_response: {attributes: {timer: null}}

  - name: reads_a_turn_off_for_timer
    roles: [switch_plug]
    only: [shelly]  # Matter has no OffWithTimedOn
    steps:
      - set: {state: on}
      - call: {action: turn_off_for, duration: 20}
      - call: {}
      - expect_response: {attributes: {timer.turns: "on", timer.remaining_s: {min: 15, max: 20}}}
      - expect_state: {state: on, within: 20 + 2 * tol}
      - call: {}
      - expect_response: {attributes: {timer: null}}
