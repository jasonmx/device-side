# hue_dimmer tests/RELEASE_CHECKLIST.md §4.1 as steps; §4.2 (a read mid-move) joins once move lands.
# On the group role the set gives every member the same values, so the room's own row reads them back too.
action: get_attributes
rig_seconds: 30
tests:
  - name: reads_while_off  # §4.1
    roles: [light_ct, group]
    steps:
      - set: {state: on, brightness: 102, color_temp_kelvin: 2700}
      - set: {state: off}
      - call: {}
      - expect_response:
          status: expected
          attributes: {brightness: {min: 100, max: 104}, color_temp_kelvin: {min: 2650, max: 2750}}
