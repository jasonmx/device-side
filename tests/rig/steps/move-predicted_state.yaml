# move.yaml's fades with predicted_state on: HA's state shows device_side's predictions, so these checks read HA, in
# 0-255 (20 % is 51, 60 % is 153, 80 % is 204).
action: move
rig_seconds: 300
options: [predicted_state]
tests:
  - name: holds_the_start_then_shows_the_end  # 20 % to full takes 8 s
    roles: [light_ct, group]
    setup:
      - set: {state: on, brightness_pct: 20}
    steps:
      - call: {brightness: up, sweep_time: 10}
      - expect_response: {status: expected, integration: self}
      - sample: {attribute: brightness, for: 3, expect: steady, min: 46, max: 56}
      - expect_state: {brightness: 255, within: 5 + tol}

  - name: soft_off_stays_on_until_its_end  # 60 % to off takes 3 s
    roles: [light_ct, group]
    setup:
      - set: {state: on, brightness_pct: 60}
    steps:
      - call: {brightness: down, sweep_time: 5}
      - sample: {attribute: brightness, for: 2, expect: steady, min: 148, max: 158}
      - expect_state: {state: off, within: 1 + tol}

  - name: up_from_off_shows_the_dimmest
    roles: [light_ct, group]
    setup:
      - set: {state: off}
    steps:
      - call: {brightness: up, sweep_time: 10}
      - expect_state: {state: on, brightness: {max: 8}, within: tol}
      - sample: {attribute: brightness, for: 3, expect: steady, max: 8}

  - name: ha_change_mid_fade_shows_at_once  # set waits for HA to show 80 %; the fade's end never replaces it
    roles: [light_ct, group]
    setup:
      - set: {state: on, brightness_pct: 20}
    steps:
      - call: {brightness: up, sweep_time: 10}
      - wait: 2
      - set: {state: on, brightness_pct: 80}
      - wait: 7
      - expect_state: {state: on, brightness: {min: 200, max: 208}}
