# The device's own timer turns the target back off. A relay sends the same call whether HA shows it as a switch,
# a light, or a switch_as_x light over the switch, so a pass on any of the three roles proves on/off for all.
action: turn_on_for
rig_seconds: 25
tests:
  - name: on_then_off
    roles: [switch_plug, light_onoff, light_wrapped]
    steps:
      - set: {state: off}
      - call: {duration: 6}
      - expect_response: {status: expected, integration: self}
      - expect_state: {state: on, within: tol}
      - wait: duration - tol
      - expect_state: {state: on}
      - expect_state: {state: off, within: 2 * tol}

  # A switch_as_x wrapper refuses light fields outright, on every integration.
  - name: refuses_brightness_on_a_wrapper
    roles: [light_wrapped]
    steps:
      - call: {duration: 6, brightness: 128}
      - expect_error: {key: all_targets_failed, summary: fields_not_supported}
      - expect_state: {state: unchanged}

  # A relay shown as a light refuses brightness because Shelly's scope has no fields yet.
  - name: refuses_brightness_out_of_scope
    roles: [light_onoff]
    only: [shelly]
    steps:
      - call: {duration: 6, brightness: 128}
      - expect_error: {key: all_targets_failed, summary: fields_not_tested}
      - expect_state: {state: unchanged}
