# raise_brightness.yaml's fades with predicted_state on: HA's state shows device_side's predictions, so these checks
# read HA, in 0-255 (20 % is 51, 80 % is 204).
action: raise_brightness
rig_seconds: 320
options: [predicted_state]
tests:
  - name: holds_the_start_then_shows_the_end  # 20 % to full takes 8 s
    roles: [light_ct, group]
    setup:
      - set: {state: on, brightness_pct: 20}
    steps:
      - call: {sweep_time: 10}
      - expect_response: {status: expected, integration: self}
      - sample: {attribute: brightness, for: 3, expect: steady, min: 46, max: 56}
      - expect_state: {brightness: 255, within: 5 + tol}

  - name: up_from_off_shows_the_dimmest
    roles: [light_ct, group]
    setup:
      - set: {state: off}
    steps:
      - call: {sweep_time: 10}
      - expect_state: {state: on, brightness: {max: 8}, within: tol}
      - sample: {attribute: brightness, for: 3, expect: steady, max: 8}

  - name: ha_change_mid_fade_shows_at_once  # set waits for HA to show 80 %; the fade's end never replaces it
    roles: [light_ct, group]
    setup:
      - set: {state: on, brightness_pct: 20}
    steps:
      - call: {sweep_time: 10}
      - wait: 2
      - set: {state: on, brightness_pct: 80}
      - wait: 7
      - expect_state: {state: on, brightness: {min: 200, max: 208}}

  - name: bridge_scene_recall_mid_fade_shows_at_once  # the fade hides the lights' reports; the recall must end that
    roles: [group]
    setup:
      - set: {state: on, brightness_pct: 10, color_temp_kelvin: 6500}  # far from the scene, so the recall shows
      - set: {state: off}
    steps:
      - call: {sweep_time: 20}
      - wait: 8  # long enough to see the cool white before the recall
      - bridge: {target: scene, recall: true}
      - wait: 20  # past the fade's end, which would show the zone at full
      # the scene's level, not the fade's full; needs the scene to hold light_ct (in the group) below full
      - expect_state: {target: light_ct, state: on, brightness: {max: 240}}
