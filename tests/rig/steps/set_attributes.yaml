# hue_dimmer tests/RELEASE_CHECKLIST.md §3 as steps.
# A room is written light by light, so on the group role the response and expect_state cover every member.
# Color steps run on the light_color role only.
action: set_attributes
rig_seconds: 125
tests:
  - name: sets_while_off  # §3.1
    roles: [light_ct, group]
    steps:
      - set: {state: off}
      - call: {brightness: 40, color_temp_kelvin: 2700}
      - expect_response: {status: expected, integration: self}
      - wait: 1
      - expect_state: {state: off}
      - set: {state: on}
      - expect_state: {brightness: {min: 100, max: 104}, color_temp_kelvin: {min: 2650, max: 2750}, within: tol}

  - name: sets_color_while_off  # §3.2
    roles: [light_color]
    setup:
      - set: {state: off}
    steps:
      - call: {rgb_color: [255, 0, 0]}
      - expect_response: {status: expected, integration: self}
      - expect_state: {state: off}
      - set: {state: on}
    observe:
      see: The color lamp, off, gets red set while off, then turns on.
      watch: 'The first moment it lights: red from the start, with no flash of its old color.'
      ask: Did it come on red?

  # A color from another, set while off: the light comes on at it. Hue converts hs to xy, and HA derives hs back.
  - name: sets_hs_while_off
    roles: [light_color]
    setup:
      - set: {state: on, hs_color: [240, 90]}
      - wait: 2  # as in get_attributes' reads_while_off: let the color land before the off
      - set: {state: off}
    steps:
      - call: {hs_color: [30, 80]}
      - expect_response: {status: expected, integration: self}
      - wait: 1
      - expect_state: {state: off}
      - set: {state: on}
      - expect_state: {hs_color.0: {min: 25, max: 35}, hs_color.1: {min: 75, max: 85}, within: tol}

  - name: sets_xy_while_off
    roles: [light_color]
    setup:
      - set: {state: on, hs_color: [240, 90]}
      - wait: 2
      - set: {state: off}
    steps:
      - call: {xy_color: [0.3, 0.5]}  # inside every Hue gamut, so it reads back as set
      - expect_response: {status: expected, integration: self}
      - wait: 1
      - expect_state: {state: off}
      - set: {state: on}
      - expect_state: {xy_color.0: {min: 0.29, max: 0.31}, xy_color.1: {min: 0.49, max: 0.51}, within: tol}

  # Hue clamps a color to the light's gamut. The A60 is gamut C, whose green corner (0.17, 0.7) is the nearest point
  # to (0.1, 0.8).
  - name: clamps_xy_to_the_gamut
    roles: [light_color]
    only: [hue]
    setup:
      - set: {state: on, hs_color: [240, 90]}
    steps:
      - call: {xy_color: [0.1, 0.8]}
      - expect_response: {status: expected, integration: self}
      - expect_state: {xy_color.0: {min: 0.16, max: 0.18}, xy_color.1: {min: 0.69, max: 0.71}, within: tol}

  - name: min_brightness_raises  # §3.3
    roles: [light_ct, group]
    steps:
      - set: {state: on, brightness_pct: 20}
      - wait: 1  # ZHA shows a group's brightness at once; let the fade end before the clamp reads it
      - call: {min_brightness: 50}
      - expect_state: {brightness: {min: 126, max: 130}, within: tol}

  - name: min_brightness_leaves_brighter  # §3.3
    roles: [light_ct, group]
    steps:
      - set: {state: on, brightness_pct: 70}
      - wait: 1
      - call: {min_brightness: 50}
      - expect_response: {status: unchanged, detail: within_limits}
      - wait: tol
      - expect_state: {brightness: {min: 177, max: 180}}

  - name: max_brightness_lowers
    roles: [light_ct, group]
    steps:
      - set: {state: on, brightness_pct: 80}
      - wait: 1
      - call: {max_brightness: 30}
      - expect_state: {brightness: {min: 75, max: 79}, within: tol}
