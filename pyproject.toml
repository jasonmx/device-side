# Virtual project (no build backend): uv reads requires-python and the dev group from it.
# "0" is a placeholder; the version lives in manifest.json.
[project]
name = "device-side"
version = "0"
requires-python = ">=3.14.2"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

lint.select = [
    "E",  # pycodestyle errors (settings from FastAPI, thanks, @tiangolo!)
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint.isort]
order-by-type = true
relative-imports-order = "closest-to-furthest"
extra-standard-library = ["typing"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
known-first-party = []

[tool.codespell]
ignore-words-list = "hass"

[dependency-groups]
dev = [
    # The version HA's hue manifest requires in the HA build pytest-homeassistant-custom-component pins.
    "aiohue==4.9.0",
    "pytest-homeassistant-custom-component==0.13.373",
    "ruff>=0.17.2",
]
