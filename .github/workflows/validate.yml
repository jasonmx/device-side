name: Validate

on:
  push:
  pull_request:
  # Restore the nightly schedule (cron "0 0 * * *") when the repo goes public: schedule payloads carry no
  # repository, so the private-repo guard below cannot skip them.
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    # The HACS action only validates public repositories; this job runs once the repo goes public.
    if: ${{ !github.event.repository.private }}
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
