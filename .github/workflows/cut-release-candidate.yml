name: Cut release candidate

# The only way a vX.Y.ZrcN tag is made (a tag ruleset refuses any other): from release/vX.Y.Z, or from main as a
# hotfix RC. Requires green CI on the head and docs/audits/<rc>.md covering every commit since the previous RC.
# Tags pushed with GITHUB_TOKEN start no other workflow, so anything an RC needs runs here.

on:
  workflow_dispatch:
    inputs:
      rc:
        description: "Tag to cut, vX.Y.ZrcN"
        required: true

permissions: {}

jobs:
  cut:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      RC: ${{ inputs.rc }}
      BRANCH: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Refuse a tag ref
        if: github.ref_type != 'branch'
        run: |
          echo "::error::Dispatch from release/vX.Y.Z or main, not a tag."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The v* tag ruleset's only bypass: GITHUB_TOKEN can't bypass a ruleset on a personal repo.
          ssh-key: ${{ secrets.RELEASE_TAG_DEPLOY_KEY }}

      - name: Check the tag against the branch
        run: python3 scripts/check_tag.py "$RC" "$BRANCH"

      - name: Refuse a release
        run: |
          if [[ ! "$RC" =~ ^v[0-9]+\.[0-9]+\.[0-9]+rc[0-9]+$ ]]; then
            echo "::error::$RC is not vX.Y.ZrcN; releases come from cut-release."
            exit 1
          fi

      - name: Require green CI on the head
        run: bash scripts/require_green.sh "$GITHUB_SHA"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

      - name: Check the audit record
        run: uv run --no-project --with pyyaml==6.0.3 python scripts/check_audit.py "$RC" "$GITHUB_SHA"

      - name: Tag and publish a pre-release
        run: |
          git tag "$RC" "$GITHUB_SHA"
          git push origin "refs/tags/$RC"
          gh release create "$RC" --verify-tag --prerelease --generate-notes --title "$RC"
