name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
      - "wt/**"

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: Install test dependencies
        run: uv sync --locked

      - name: Run tests
        run: .venv/bin/pytest -q tests/ --cov=custom_components/device_side --cov-report=json

      - name: Check coverage
        run: .venv/bin/python scripts/check_release.py --coverage coverage.json
